# Runs on GitHub Actions and on Gitea Actions (Gitea reads .github/workflows/
# as well as .gitea/workflows/). Gitea needs Actions enabled and an act_runner
# registered with the `ubuntu-latest` label, or these jobs are silently skipped.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# setup-go installs the toolchain named by the go directive in go.mod. This
# forbids the go command from quietly downloading a second one on top of it
# (a 104MB zip that unpacks to 247MB in the module cache) if the two ever
# drift. The build fails with "requires go >= X (running Y; GOTOOLCHAIN=local)"
# instead, which names the mismatch directly.
env:
  GOTOOLCHAIN: local

jobs:
  host:
    name: host and plugins
    runs-on: ubuntu-latest

    # Only the common plugin needs this: its New() opens a database at
    # construction time and panics when one is not reachable. Connectivity is
    # enough, no schema — nothing queries during startup. If a runner cannot
    # provide service containers, delete this block: the smoke test skips the
    # common plugin when no database is reachable and still covers the rest.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oasis
          POSTGRES_USER: oasis
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oasis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Caches the module cache and the build cache, but only on github.com.
          # act_runner's cache server (172.19.0.4:37367) is unreachable from the
          # per-job bridge networks it creates, so on Gitea every restore and
          # save burns a ~4m40s TCP connect timeout — far more than it saves.
          # Measured payoff on a warm hit: ~4s of module downloads (34MB of zips
          # across 45 modules) plus ~8s of cold compilation.
          cache: ${{ startsWith(github.server_url, 'https://github.com') }}

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            echo "Run: gofmt -w \$(gofmt -l .)"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: locate database
        run: |
          # GitHub-hosted runners publish service ports on localhost. Gitea's
          # act_runner runs the job inside a container on the service network,
          # where the service answers to its own name instead. Try both, and
          # leave OASIS_DB_URL unset if neither answers so the smoke test skips
          # the common plugin rather than failing on an unreachable database.
          for host in localhost db; do
            if timeout 2 bash -c "cat < /dev/null > /dev/tcp/$host/5432" 2>/dev/null; then
              echo "Postgres reachable at $host:5432"
              echo "OASIS_DB_URL=postgres://oasis:password@$host:5432/oasis?sslmode=disable" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No Postgres reachable; the common plugin smoke test will skip."

      # Covers internal/smoke, which builds every plugin and drives it through
      # the handshake and all three RPC methods. go build cannot see those
      # breaks: they only surface once the host launches the subprocess.
      - name: go test
        run: go test ./...

      # Compare the tree before and after rather than diffing against HEAD, so
      # the check reports only what this step changed.
      - name: go mod tidy is up to date
        run: |
          before=$(git status --porcelain go.mod go.sum)
          go mod tidy
          if [ "$before" != "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod/go.sum are not tidy. Run: go mod tidy"
            git diff --stat go.mod go.sum
            exit 1
          fi

      - name: go mod verify
        run: go mod verify

      # plugin/common checks in 38 generated files. Regenerate and diff so a
      # hand-edit to a DO NOT EDIT file, or a template change that was never
      # re-run, fails here instead of drifting silently.
      - name: generated code is up to date
        run: |
          before=$(git status --porcelain)
          go generate ./...
          if [ "$before" != "$(git status --porcelain)" ]; then
            echo "Generated code is out of date. Run: go generate ./..."
            git diff --stat
            exit 1
          fi

  # command/generate is a separate module, so the root ./... above never sees it.
  generate:
    name: command/generate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command/generate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: command/generate/go.mod
          # See the note in the host job: github.com only.
          cache: ${{ startsWith(github.server_url, 'https://github.com') }}
          cache-dependency-path: command/generate/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # Compare the tree before and after rather than diffing against HEAD, so
      # the check reports only what this step changed.
      - name: go mod tidy is up to date
        run: |
          before=$(git status --porcelain go.mod go.sum)
          go mod tidy
          if [ "$before" != "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod/go.sum are not tidy. Run: go mod tidy"
            git diff --stat go.mod go.sum
            exit 1
          fi

      - name: go mod verify
        run: go mod verify
